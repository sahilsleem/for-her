<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="50%" stop-color="#FFE4E8"/>
      <stop offset="100%" stop-color="#FCD5CE"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE8D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="1000" fill="url(#heroBg)"/>
  <rect x="25" y="25" width="750" height="950" rx="20" fill="none" stroke="#E8A598" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Sun Glow & Horizon -->
  <circle cx="400" cy="420" r="180" fill="url(#sunGlow)"/>
  
  <!-- Subtle Heart Arc -->
  <path d="M 400 320 C 350 240, 220 270, 220 380 C 220 480, 340 560, 400 620 C 460 560, 580 480, 580 380 C 580 270, 450 240, 400 320 Z" 
        fill="#FFFFFF" fill-opacity="0.55" filter="url(#softGlow)"/>

  <!-- Romantic Sparkles & Florals -->
  <g fill="#D67B88" opacity="0.85">
    <!-- Star sparkles -->
    <path d="M 280 260 Q 280 280 260 280 Q 280 280 280 300 Q 280 280 300 280 Q 280 280 280 260 Z" />
    <path d="M 520 250 Q 520 270 500 270 Q 520 270 520 290 Q 520 270 540 270 Q 520 270 520 250 Z" />
    <path d="M 230 460 Q 230 475 215 475 Q 230 475 230 490 Q 230 475 245 475 Q 230 475 230 460 Z" />
    <path d="M 570 450 Q 570 465 555 465 Q 570 465 570 480 Q 570 465 585 465 Q 570 465 570 450 Z" />
  </g>

  <!-- Camera / Frame Icon in Center -->
  <g transform="translate(340, 380)" fill="none" stroke="#B85D6F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="20" width="120" height="90" rx="14" fill="#FFFFFF" fill-opacity="0.7"/>
    <path d="M 35 20 L 45 5 L 75 5 L 85 20" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="60" cy="65" r="26" fill="#FFF0F3"/>
    <circle cx="60" cy="65" r="14" fill="#B85D6F"/>
    <circle cx="95" cy="38" r="4" fill="#B85D6F"/>
  </g>

  <!-- Typography -->
  <text x="400" y="680" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#6B1D2A" text-anchor="middle" letter-spacing="1">
    our favourite photograph ♡
  </text>
  <text x="400" y="725" font-family="'Helvetica Neue', sans-serif" font-size="19" fill="#8E4F5A" text-anchor="middle" opacity="0.9">
    A space reserved for the two of us
  </text>

  <!-- Instructional Pill -->
  <g transform="translate(180, 770)">
    <rect width="440" height="64" rx="32" fill="#FFFFFF" stroke="#E8A598" stroke-width="1.5" opacity="0.95"/>
    <circle cx="45" cy="32" r="16" fill="#FFE4E8"/>
    <text x="45" y="38" font-family="sans-serif" font-size="16" fill="#B85D6F" text-anchor="middle">📷</text>
    <text x="245" y="31" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#6B1D2A" text-anchor="middle">
      assets/photos/couple-hero.jpg
    </text>
    <text x="245" y="50" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#8E4F5A" text-anchor="middle">
      (replace this file to display our genuine picture)
    </text>
  </g>

  <!-- Botanical branch at bottom -->
  <path d="M 310 910 Q 400 870 490 910" stroke="#D67B88" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="340" cy="895" r="5" fill="#E8A598"/>
  <circle cx="400" cy="880" r="6" fill="#D67B88"/>
  <circle cx="460" cy="895" r="5" fill="#E8A598"/>
</svg>
