<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_couple-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="100%" stop-color="#FFE8D6"/>
    </linearGradient>
    <radialGradient id="glow_couple-1" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg_couple-1)"/>
  <rect x="30" y="30" width="740" height="940" rx="24" fill="none" stroke="#C97A63" stroke-width="2" stroke-dasharray="6,6" opacity="0.55"/>

  <circle cx="400" cy="400" r="160" fill="url(#glow_couple-1)"/>

  <!-- Illustrated central badge -->
  <g transform="translate(310, 290)">
    <circle cx="90" cy="90" r="88" fill="#FFFFFF" fill-opacity="0.85" stroke="#C97A63" stroke-width="2.5"/>
    <circle cx="90" cy="90" r="76" fill="none" stroke="#C97A63" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <text x="90" y="105" font-size="64" text-anchor="middle">☕</text>
  </g>

  <!-- Sparkle doodles -->
  <g fill="#C97A63" opacity="0.7">
    <path d="M 260 250 Q 260 265 245 265 Q 260 265 260 280 Q 260 265 275 265 Q 260 265 260 250 Z" />
    <path d="M 540 240 Q 540 255 525 255 Q 540 255 540 270 Q 540 255 555 255 Q 540 255 540 240 Z" />
    <circle cx="240" cy="460" r="4" fill="#C97A63" />
    <circle cx="560" cy="450" r="4" fill="#C97A63" />
  </g>

  <!-- Typography -->
  <text x="400" y="560" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#5C2D20" text-anchor="middle" letter-spacing="0.5">
    quiet mornings together ♡
  </text>
  <text x="400" y="605" font-family="'Helvetica Neue', sans-serif" font-size="19" fill="#C97A63" text-anchor="middle">
    Warm tea, soft blankets & slow talks
  </text>

  <!-- Instructional Pill -->
  <g transform="translate(160, 680)">
    <rect width="480" height="74" rx="37" fill="#FFFFFF" stroke="#C97A63" stroke-width="1.5" opacity="0.95"/>
    <circle cx="50" cy="37" r="18" fill="#FFF5EB"/>
    <text x="50" y="43" font-size="16" text-anchor="middle">📷</text>
    <text x="270" y="34" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#5C2D20" text-anchor="middle">
      assets/photos/couple-1.jpg
    </text>
    <text x="270" y="56" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C97A63" text-anchor="middle">
      (drop this picture in to replace placeholder)
    </text>
  </g>

  <!-- Bottom flourish -->
  <g stroke="#C97A63" stroke-width="1.8" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 320 840 Q 400 820 480 840" />
    <circle cx="400" cy="828" r="3.5" fill="#C97A63" />
  </g>
</svg>